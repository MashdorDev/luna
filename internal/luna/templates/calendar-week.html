{{ template "widget-base.html" . }}

{{ define "widget-content" }}
<div class="cw" data-cal-root data-cal-home="{{ .Calendar.Zone }}" data-cal-hidden="{{ .Calendar.HiddenJSON }}" data-cal-remind="{{ .Calendar.RemindJSON }}" data-cal-zones="{{ .Calendar.ZonesJSON }}" data-cal-days="{{ .Days }}" data-cal-events="{{ .EventsJSON }}">
    <div class="cw-top">
        <div class="cw-summary" data-cal-summary></div>
        <div class="cw-weeknav" data-cal-weeknav>
            <button type="button" data-cal-week-step="-1" aria-label="Previous week">&lsaquo;</button><span data-cal-week-label></span><button type="button" data-cal-week-step="1" aria-label="Next week">&rsaquo;</button>
        </div>
        <div class="cw-views" role="group" aria-label="View">
            <button type="button" data-cal-view="week">Week</button><button type="button" data-cal-view="list">List</button>
        </div>
    </div>
    <div class="cw-legend">
        {{ range .Calendar.Calendars }}
        <label class="cal-c{{ .Color }}"><input type="checkbox" data-cal-toggle="{{ .Name }}"><i></i>{{ .Name }}</label>
        {{ end }}
        {{ if .Calendar.CanConnect }}<a class="cw-add" href="api/calendar/connect" title="Sign in to a Google account and pick calendars">+ Add calendar</a>{{ end }}
        <button type="button" class="cal-bell" data-cal-notify hidden></button>
        <span class="cw-zone" data-cal-zone hidden></span>
    </div>
    <div class="cw-scroll" data-cal-week-wrap><div class="cw-grid" data-cal-grid></div></div>
    <div class="cw-list" data-cal-list hidden></div>
</div>
{{ end }}
